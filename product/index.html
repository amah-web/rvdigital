            {
                id: 102,
                title: "Kelas Optimasi Story For Shopee Affiliate",
                price: "Rp 35.000",
                originalPrice: "Rp 89.000",
                image: "https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?auto=format&fit=crop&w=500&q=80",
                link: "https://ratakan.com"
            }
        ];

        // 3. PENGATURAN KATEGORI (Opsi Apakah Grid Promo Tampil di Kategori Ini)
        const categorySettings = {
            'all': { name: 'Beranda / Semua Produk', showGrid: true },
            'aplikasi-premium': { name: 'Aplikasi Premium & Media Sosial', showGrid: false },
            'bisnis': { name: 'Bisnis & Kewirausahaan', showGrid: false },
            'gratis': { name: 'Produk Gratis', showGrid: false },
            'jasa': { name: 'Jasa & Layanan Profesional', showGrid: false },
            'kesehatan': { name: 'Kesehatan & Kebugaran', showGrid: false },
            'keuangan': { name: 'Keuangan & Investasi', showGrid: false },
            'konten-kreator': { name: 'Kreatif & Desain Visual', showGrid: false },
            'lifestyle': { name: 'Gaya Hidup & Hobi', showGrid: false },
            'parenting': { name: 'Parenting & Keluarga', showGrid: false },
            'pendidikan': { name: 'Pendidikan', showGrid: false },
            'pengembangan-diri': { name: 'Pengembangan Diri & Spiritual', showGrid: false },
            'relationship': { name: 'Hubungan & Komunikasi', showGrid: false },
            'teknologi': { name: 'Teknologi & Tools', showGrid: false }
        };

        // 4. DATABASE NOTIFIKASI PEMBELIAN BERJALAN (Bisa Di-edit Manual)
        const buyerNotifications = [
            { buyer: "Uxxi Sxxxxxh", product: "Blogging Marketing (BM)" },
            { buyer: "Axxi Pxxxxa", product: "Trik Broadcast WA Anti Blokir" },
            { buyer: "Rxxa Kxxxxa", product: "Ebook Newbiepreneur" },
            { buyer: "Dxxi Sxxxxo", product: "Tiktok Content Mastery" },
            { buyer: "Bxxg Fxxxxi", product: "Shopee Affiliate Mastery" }
        ];

        // State Aplikasi
        let currentTab = 'all';
        let searchQuery = '';
        let currentPage = 1;
        const itemsPerPage = 10; // Jumlah produk per halaman
        let showListImages = false; // Mode gambar thumbnail di list
        let isDarkMode = true;
        let notificationIndex = 0;

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderListProducts();
            renderGridProducts();
            startSalesNotificationLoop();
        });

        // Toggle Mode Terang / Gelap
        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.getElementById('appBody');
            const themeIcon = document.getElementById('themeIcon');
            const themeLabel = document.getElementById('themeLabel');

            if (isDarkMode) {
                document.documentElement.classList.add('dark');
                body.className = "bg-gradient-to-br from-slate-950 via-purple-950 to-indigo-950 min-h-screen text-slate-100 pb-20 selection:bg-purple-500 selection:text-white";
                themeIcon.className = "fa-solid fa-sun text-amber-400";
                themeLabel.textContent = "Mode Terang";
            } else {
                document.documentElement.classList.remove('dark');
                body.className = "bg-gradient-to-br from-purple-100 via-indigo-50 to-purple-200 min-h-screen text-slate-900 pb-20 selection:bg-purple-600 selection:text-white";
                themeIcon.className = "fa-solid fa-moon text-purple-700";
                themeLabel.textContent = "Mode Gelap";
            }
        }

        // Toggle Tampilan Gambar / Teks di Daftar List
        function toggleListImages() {
            showListImages = !showListImages;
            const btn = document.getElementById('btnToggleImages');
            if (showListImages) {
                btn.textContent = "Mode Teks Saja";
                btn.className = "px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-lg transition";
            } else {
                btn.textContent = "Tampilkan Gambar";
                btn.className = "px-2.5 py-1 bg-purple-700/60 hover:bg-purple-600 text-white font-semibold rounded-lg transition";
            }
            renderListProducts();
        }

        // Filter Produk berdasarkan Tab & Kata Kunci Cari
        function getFilteredProducts() {
            return productsData.filter(item => {
                const matchesTab = (currentTab === 'all') || (item.category === currentTab);
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.detail.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesTab && matchesSearch;
            });
        }

        // Render List Produk (1 Tab Redirect, Tanpa Popup Confirmation, Nama Produk Tidak Terpotong)
        function renderListProducts() {
            const container = document.getElementById('productList');
            const counterEl = document.getElementById('productCounter');
            const filtered = getFilteredProducts();

            // Hitung Pagination
            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(startIndex, startIndex + itemsPerPage);

            counterEl.textContent = `Total: ${filtered.length} produk (Hal ${currentPage}/${totalPages})`;

            // Jika Kosong
            if (paginatedItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-box-open text-3xl mb-2 text-purple-400/60"></i>
                        <p class="text-xs">Produk tidak ditemukan.</p>
                    </div>
                `;
            } else {
                container.innerHTML = paginatedItems.map(item => `
                    <a href="${item.link}" target="_self" 
                       class="flex items-center justify-between p-3.5 bg-white dark:bg-slate-800/90 hover:bg-purple-50 dark:hover:bg-purple-900/30 border border-slate-200/80 dark:border-slate-700/80 rounded-xl transition-all shadow-sm active:scale-[0.99] group">
                        
                        <div class="flex items-start gap-3 min-w-0 pr-2">
                            ${showListImages ? `
                                <img src="${item.image}" alt="${item.title}" class="w-11 h-11 object-cover rounded-lg border border-purple-300 dark:border-purple-700 shrink-0 mt-0.5">
                            ` : `
                                <div class="w-9 h-9 bg-purple-100 dark:bg-purple-900/50 group-hover:bg-purple-600 text-purple-700 dark:text-purple-300 group-hover:text-white rounded-lg flex items-center justify-center shrink-0 transition-colors mt-0.5">
                                    <i class="${item.icon} text-xs"></i>
                                </div>
                            `}
                            
                            <!-- Kunci Agar Nama Panjang Produk TIDAK Terpotong: break-words, whitespace-normal -->
                            <div class="min-w-0 flex-1">
                                <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100 leading-snug whitespace-normal break-words group-hover:text-purple-600 dark:group-hover:text-purple-300 transition-colors">
                                    ${item.title}
                                </h4>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1 font-medium">
                                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                    ${item.detail}
                                </p>
                            </div>
                        </div>

                        <div class="shrink-0 text-slate-400 group-hover:text-purple-500 group-hover:translate-x-1 transition-all pl-1">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </div>
                    </a>
                `).join('');
            }

            renderPaginationControls(totalPages);
        }

        // Render Tombol Pagination Angka < 1 2 3 >
        function renderPaginationControls(totalPages) {
            const paginationContainer = document.getElementById('paginationNumbers');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            btnPrev.disabled = currentPage === 1;
            btnNext.disabled = currentPage === totalPages || totalPages === 0;

            let numbersHtml = '';
            for (let i = 1; i <= totalPages; i++) {
                const isActive = i === currentPage;
                numbersHtml += `
                    <button onclick="goToPage(${i})" 
                            class="w-7 h-7 rounded-lg text-xs font-bold transition-all ${
                                isActive 
                                ? 'bg-purple-600 text-white shadow-md shadow-purple-600/40' 
                                : 'hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                            }">
                        ${i}
                    </button>
                `;
            }
            paginationContainer.innerHTML = numbersHtml;
        }

        // Ubah Halaman
        function changePage(direction) {
            currentPage += direction;
            renderListProducts();
            scrollToMainCard();
        }

        // Jump ke Halaman Spesifik
        function goToPage(page) {
            currentPage = page;
            renderListProducts();
            scrollToMainCard();
        }

        function scrollToMainCard() {
            document.getElementById('mainCardBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Handle Search Bar
        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            currentPage = 1; // Reset ke halaman pertama
            renderListProducts();
        }

        // Switch Multipage Tabs
        function switchTab(tabName) {
            currentTab = tabName;
            currentPage = 1; // Reset halaman ke 1

            // Update Tab active styling
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-purple-400', 'text-white', 'font-bold');
                btn.classList.add('border-transparent', 'text-purple-300');
            });

            const activeBtn = document.getElementById(`tab-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-purple-300');
                activeBtn.classList.add('border-purple-400', 'text-white', 'font-bold');
            }

            // Atur Visibilitas Grid Section (Sesuai Opsi Kategori)
            const gridSection = document.getElementById('gridSection');
            const catSetting = categorySettings[tabName] || { showGrid: true };
            if (catSetting.showGrid) {
                gridSection.classList.remove('hidden');
            } else {
                gridSection.classList.add('hidden');
            }

            // Update Label Judul
            document.getElementById('sectionLabel').textContent = catSetting.name || 'Produk Pilihan';

            renderListProducts();
        }

        // Render Produk Grid Bergambar (Rekomendasi Spesial)
        function renderGridProducts() {
            const gridContainer = document.getElementById('gridProductList');
            gridContainer.innerHTML = gridProductsData.map(item => `
                <a href="${item.link}" target="_self" 
                   class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-900 dark:border-slate-700 border-shadow-light dark:border-shadow-purple hover:-translate-y-1 transition-transform flex flex-col justify-between group">
                    <div>
                        <!-- Gambar Persegi Panjang Aspect Ratio 16:9 -->
                        <div class="w-full aspect-video overflow-hidden bg-slate-100 dark:bg-slate-800 relative">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        </div>
                        <div class="p-3">
                            <!-- Judul Teks Penuh Tanpa Terpotong -->
                            <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-snug whitespace-normal break-words">${item.title}</h4>
                        </div>
                    </div>
                    <div class="px-3 pb-3 pt-0">
                        <div class="text-xs font-black text-purple-700 dark:text-purple-400">${item.price}</div>
                        <div class="text-[10px] text-slate-400 line-through">${item.originalPrice}</div>
                    </div>
                </a>
            `).join('');
        }

        // 5. NOTIFIKASI PEMBELI OTOMATIS (SALES TOAST POP-UP)
        function showSalesToast() {
            const toast = document.getElementById('salesToast');
            const data = buyerNotifications[notificationIndex];

            document.getElementById('toastBuyerName').textContent = data.buyer;
            document.getElementById('toastProductName').textContent = `Sudah membeli '${data.product}'`;

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            // Sembunyikan otomatis setelah 5 detik
            setTimeout(() => {
                hideSalesToast();
            }, 5000);

            // Rotasi ke data pembeli berikutnya
            notificationIndex = (notificationIndex + 1) % buyerNotifications.length;
        }

        function hideSalesToast() {
            const toast = document.getElementById('salesToast');
            toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.remove('translate-y-0', 'opacity-100');
        }

        function startSalesNotificationLoop() {
            // Tampilkan pertama kali setelah 3 detik
            setTimeout(() => {
                showSalesToast();
                // Kemudian rotasi setiap 12 detik
                setInterval(showSalesToast, 12000);
            }, 3000);
        }
    </script>
</body>
</html>
