            });

            if (currentPage < 1) currentPage = 1;

            } else {
                container.innerHTML = paginatedItems.map(item => `
                    <a href="${item.link}" target="_self" 
                       class="flex items-center justify-between p-3.5 bg-white dark:bg-slate-800/90 hover:bg-purple-50 dark:hover:bg-purple-900/30 border border-slate-200/80 dark:border-slate-700/80 rounded-xl transition-all shadow-sm active:scale-[0.99] group">
                        
                        <div class="flex items-start gap-3 min-w-0 pr-2">
                            <div class="w-9 h-9 bg-purple-100 dark:bg-purple-900/50 group-hover:bg-purple-600 text-purple-700 dark:text-purple-300 group-hover:text-white rounded-lg flex items-center justify-center shrink-0 transition-colors mt-0.5">
                                <i class="${item.icon} text-xs"></i>
                            </div>
                            
                            <div class="min-w-0 flex-1">
                                <h4 class="text-xs font-bold text-slate-900 dark:text-slate-100 leading-snug whitespace-normal break-words group-hover:text-purple-600 dark:group-hover:text-purple-300 transition-colors">
                                    ${item.title}
                                </h4>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1 font-medium">
                                    <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                    ${item.detail}
                                </p>
                            </div>
                        </div>

                        <div class="shrink-0 text-slate-400 group-hover:text-purple-500 group-hover:translate-x-1 transition-all pl-1">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </div>
                    </a>
                `).join('');
            }

            renderPaginationControls(totalPages);
        }

        // Render Grid Rekomendasi
        function renderGridProducts() {
            const gridContainer = document.getElementById('gridProductList');
            gridContainer.innerHTML = gridProductsData.map(item => `
                <a href="${item.link}" target="_self" 
                   class="bg-white dark:bg-slate-900 rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 hover:-translate-y-1 transition-transform flex flex-col justify-between group shadow-sm">
                    <div>
                        <div class="w-full aspect-video overflow-hidden bg-slate-100 dark:bg-slate-800 relative">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        </div>
                        <div class="p-3">
                            <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100 leading-snug whitespace-normal break-words">${item.title}</h4>
                        </div>
                    </div>
                    <div class="px-3 pb-3 pt-0">
                        <div class="text-xs font-black text-purple-700 dark:text-purple-400">${item.price}</div>
                        <div class="text-[10px] text-slate-400 line-through">${item.originalPrice}</div>
                    </div>
                </a>
            `).join('');
        }

        // Render Pagination Controls
        function renderPaginationControls(totalPages) {
            const paginationContainer = document.getElementById('paginationNumbers');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');

            btnPrev.disabled = currentPage === 1;
            btnNext.disabled = currentPage === totalPages || totalPages === 0;

            let numbersHtml = '';
            for (let i = 1; i <= totalPages; i++) {
                const isActive = i === currentPage;
                numbersHtml += `
                    <button onclick="goToPage(${i})" 
                            class="w-7 h-7 rounded-lg text-xs font-bold transition-all ${
                                isActive 
                                ? 'bg-purple-600 text-white shadow-md shadow-purple-600/40' 
                                : 'hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300'
                            }">
                        ${i}
                    </button>
                `;
            }
            paginationContainer.innerHTML = numbersHtml;
        }

        function changePage(direction) {
            currentPage += direction;
            renderListProducts();
            scrollToMainCard();
        }

        function goToPage(page) {
            currentPage = page;
            renderListProducts();
            scrollToMainCard();
        }

        function scrollToMainCard() {
            document.getElementById('mainCardBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            currentPage = 1;
            renderListProducts();
        }

        // Switch Tabs & Control Grid Section Visibility
        function switchTab(tabName) {
            currentTab = tabName;
            currentPage = 1;

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-purple-400', 'text-white', 'font-bold');
                btn.classList.add('border-transparent', 'text-purple-300');
            });

            const activeBtn = document.getElementById(`tab-${tabName}`);
            if (activeBtn) {
                activeBtn.classList.remove('border-transparent', 'text-purple-300');
                activeBtn.classList.add('border-purple-400', 'text-white', 'font-bold');
            }

            // Atur Visibilitas Grid Section berdasarkan variabel configuration
            const gridSection = document.getElementById('gridSection');
            const catSetting = categorySettings[tabName] || { name: 'Produk Pilihan', showGrid: false };
            
            if (catSetting.showGrid) {
                gridSection.classList.remove('hidden');
            } else {
                gridSection.classList.add('hidden');
            }

            document.getElementById('sectionLabel').textContent = catSetting.name || 'Produk Pilihan';
            renderListProducts();
        }

        // Sales Toast Popup
        function showSalesToast() {
            const toast = document.getElementById('salesToast');
            const data = buyerNotifications[notificationIndex];

            document.getElementById('toastBuyerName').textContent = data.buyer;
            document.getElementById('toastProductName').textContent = `Sudah membeli '${data.product}'`;

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                hideSalesToast();
            }, 5000);

            notificationIndex = (notificationIndex + 1) % buyerNotifications.length;
        }

        function hideSalesToast() {
            const toast = document.getElementById('salesToast');
            toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.remove('translate-y-0', 'opacity-100');
        }

        function startSalesNotificationLoop() {
            setTimeout(() => {
                showSalesToast();
                setInterval(showSalesToast, 12000);
            }, 3000);
        }
    </script>
</body>
</html>
